name: PR Check + Trigger Jenkins

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # ── Fast pre-check before Jenkins picks it up ────────────────────────────
  lint:
    name: Lint & static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Check code style
        run: ./vendor/bin/pint --test

  # ── Trigger Jenkins pipeline after PR merge ──────────────────────────────
  trigger-jenkins:
    name: Trigger Jenkins
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    steps:
      - name: Trigger via MCP server
        env:
          MCP_URL: ${{ secrets.MCP_SERVER_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST "${MCP_URL}/tool/trigger_pipeline" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": "${{ github.ref_name }}",
              "reason": "github-push",
              "triggered_by": "${{ github.actor }}"
            }'
