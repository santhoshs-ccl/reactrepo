name: PR Check + Trigger Jenkins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-static-check:
    name: Lint & static check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  trigger-jenkins:
    name: Trigger Jenkins
    needs: lint-and-static-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Jenkins build
        run: |
          curl -f -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "http://${{ secrets.JENKINS_HOST }}/job/ccl-crystal-billz/build?token=BUILD_TOKEN"
